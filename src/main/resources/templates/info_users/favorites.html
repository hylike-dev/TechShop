<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản Phẩm Yêu Thích - TechShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
    <link rel="stylesheet" th:href="@{/css/index_style.css}">
    <link rel="stylesheet" th:href="@{/css/favorites_style.css}">
    <link rel="stylesheet" th:href="@{/css/user_sidebar_style.css}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">

    <!-- Header Fragment -->
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="py-4">
        <div class="container">
            <div class="row g-4">
                <!-- User Sidebar Fragment -->
                <div class="col-lg-3">
                    <div th:replace="~{fragments/user_sidebar :: user_sidebar('favorites')}"></div>
                </div>

                <div class="col-lg-9">
                    <div class="card border-0 shadow-sm p-4 rounded-4 bg-white">
                        <h4 class="fw-bold mb-4 border-bottom pb-2"><i class="fas fa-heart text-danger me-2"></i>Danh Sách Yêu Thích</h4>

                        <div class="row g-4">
                            <!-- Favorite Product 1 -->
                            <div class="col-md-4">
                                <div class="card h-100 border-0 shadow-sm product-card">
                                    <div class="p-4 text-center bg-light rounded-top">
                                        <i class="fas fa-mobile-alt fa-4x text-primary"></i>
                                    </div>
                                    <div class="card-body">
                                        <h6 class="fw-bold text-dark">iPhone 16 Pro Max 256GB</h6>
                                        <div class="fw-bold text-danger mb-2">34.990.000 đ</div>
                                        <div class="d-flex gap-2">
                                            <a th:href="@{/detail(id=1)}" class="btn btn-primary btn-sm flex-fill fw-bold">Xem Chi Tiết</a>
                                            <button class="btn btn-outline-danger btn-sm"><i class="fas fa-trash-alt"></i></button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Favorite Product 2 -->
                            <div class="col-md-4">
                                <div class="card h-100 border-0 shadow-sm product-card">
                                    <div class="p-4 text-center bg-light rounded-top">
                                        <i class="fas fa-headphones fa-4x text-success"></i>
                                    </div>
                                    <div class="card-body">
                                        <h6 class="fw-bold text-dark">Sony WH-1000XM5</h6>
                                        <div class="fw-bold text-danger mb-2">7.990.000 đ</div>
                                        <div class="d-flex gap-2">
                                            <a th:href="@{/detail(id=3)}" class="btn btn-primary btn-sm flex-fill fw-bold">Xem Chi Tiết</a>
                                            <button class="btn btn-outline-danger btn-sm"><i class="fas fa-trash-alt"></i></button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
