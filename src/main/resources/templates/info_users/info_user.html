<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Tin Tài Khoản - TechShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
    <link rel="stylesheet" th:href="@{/css/index_style.css}">
    <link rel="stylesheet" th:href="@{/css/info_user_style.css}">
    <link rel="stylesheet" th:href="@{/css/user_sidebar_style.css}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">

    <!-- Header Fragment -->
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="py-4">
        <div class="container">
            <div class="row g-4">
                <!-- User Sidebar Fragment -->
                <div class="col-lg-3">
                    <div th:replace="~{fragments/user_sidebar :: user_sidebar('profile')}"></div>
                </div>

                <!-- Profile Info Form -->
                <div class="col-lg-9">
                    <div class="card border-0 shadow-sm p-4 rounded-4 bg-white">
                        <h4 class="fw-bold mb-4 border-bottom pb-2"><i class="fas fa-user-edit text-primary me-2"></i>Thông Tin Cá Nhân</h4>

                        <form>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold">Họ và tên</label>
                                    <input type="text" class="form-control" value="Nguyễn Văn Tech">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold">Số điện thoại</label>
                                    <input type="tel" class="form-control" value="0988777666">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold">Địa chỉ Email</label>
                                    <input type="email" class="form-control" value="techuser@gmail.com" readonly>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold">Giới tính</label>
                                    <select class="form-select">
                                        <option selected>Nam</option>
                                        <option>Nữ</option>
                                        <option>Khác</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label small fw-bold">Địa chỉ nhận hàng mặc định</label>
                                    <input type="text" class="form-control" value="Số 123 Đường Cầu Giấy, Phường Dịch Vọng, Q. Cầu Giấy, Hà Nội">
                                </div>
                            </div>

                            <hr class="my-4">

                            <button type="button" onclick="saveProfile()" class="btn btn-primary fw-bold px-4">Lưu Thay Đổi</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function saveProfile() {
            Swal.fire({
                icon: 'success',
                title: 'Cập nhật thành công!',
                text: 'Thông tin cá nhân của bạn đã được cập nhật thành công.',
                timer: 2000,
                showConfirmButton: false
            });
        }
    </script>
</body>
</html>
