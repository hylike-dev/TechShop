<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sổ Địa Chỉ - TechShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
    <link rel="stylesheet" th:href="@{/css/index_style.css}">
    <link rel="stylesheet" th:href="@{/css/address_style.css}">
    <link rel="stylesheet" th:href="@{/css/user_sidebar_style.css}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">

    <!-- Header Fragment -->
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="py-4">
        <div class="container">
            <div class="row g-4">
                <!-- User Sidebar Fragment -->
                <div class="col-lg-3">
                    <div th:replace="~{fragments/user_sidebar :: user_sidebar('addresses')}"></div>
                </div>

                <div class="col-lg-9">
                    <div class="card border-0 shadow-sm p-4 rounded-4 bg-white">
                        <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
                            <h4 class="fw-bold m-0"><i class="fas fa-map-marked-alt text-primary me-2"></i>Sổ Địa Chỉ Giao Hàng</h4>
                            <button class="btn btn-primary btn-sm fw-bold"><i class="fas fa-plus me-1"></i>Thêm Địa Chỉ Mới</button>
                        </div>

                        <div class="border rounded-3 p-3 mb-3 bg-light d-flex justify-content-between align-items-center">
                            <div>
                                <div class="d-flex align-items-center gap-2 mb-1">
                                    <strong class="text-dark">Nguyễn Văn Tech</strong>
                                    <span class="badge bg-primary">Mặc Định</span>
                                </div>
                                <p class="small text-muted mb-0">SĐT: 0988777666</p>
                                <p class="small text-muted mb-0">Địa chỉ: Số 123 Đường Cầu Giấy, Phường Dịch Vọng, Q. Cầu Giấy, Hà Nội</p>
                            </div>
                            <div class="d-flex gap-2">
                                <button class="btn btn-outline-secondary btn-sm"><i class="fas fa-edit"></i> Sửa</button>
                                <button class="btn btn-outline-danger btn-sm"><i class="fas fa-trash"></i> Xóa</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
