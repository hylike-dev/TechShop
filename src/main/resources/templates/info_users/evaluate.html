<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Sử Đánh Giá - TechShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
    <link rel="stylesheet" th:href="@{/css/index_style.css}">
    <link rel="stylesheet" th:href="@{/css/review_history_style.css}">
    <link rel="stylesheet" th:href="@{/css/user_sidebar_style.css}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">

    <!-- Header Fragment -->
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="py-4">
        <div class="container">
            <div class="row g-4">
                <!-- User Sidebar Fragment -->
                <div class="col-lg-3">
                    <div th:replace="~{fragments/user_sidebar :: user_sidebar('reviews')}"></div>
                </div>

                <div class="col-lg-9">
                    <div class="card border-0 shadow-sm p-4 rounded-4 bg-white">
                        <h4 class="fw-bold mb-4 border-bottom pb-2"><i class="fas fa-star text-warning me-2"></i>Lịch Sử Đánh Giá</h4>

                        <div class="border rounded-3 p-3 mb-3 bg-light">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h6 class="fw-bold m-0 text-dark">iPhone 16 Pro Max 256GB</h6>
                                <span class="text-warning"><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i> (5/5)</span>
                            </div>
                            <p class="small text-muted mb-1">Máy đẹp xuất sắc, titan đen cầm rất đầm tay. Giao hàng tại HN chỉ mất 1 tiếng rưỡi!</p>
                            <small class="text-muted"><i class="far fa-clock me-1"></i>Đánh giá ngày 27/07/2026</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
