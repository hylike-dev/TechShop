<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khôi Phục Mật Khẩu - TechShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
    <link rel="stylesheet" th:href="@{/css/index_style.css}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .auth-card {
            max-width: 450px;
            margin: 0 auto;
            border-radius: 20px;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Header Fragment -->
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="py-5">
        <div class="container">
            <div class="card border-0 shadow-sm p-4 p-md-5 bg-white auth-card">
                <div class="text-center mb-4">
                    <i class="fas fa-key fa-3x text-warning mb-2"></i>
                    <h3 class="fw-bold text-dark mb-1">Quên Mật Khẩu?</h3>
                    <p class="text-muted small">Nhập email đăng ký của bạn để nhận mã khôi phục tài khoản</p>
                </div>

                <form>
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Email đăng ký</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fas fa-envelope text-muted"></i></span>
                            <input type="email" class="form-control" placeholder="techuser@gmail.com" required>
                        </div>
                    </div>

                    <button type="button" onclick="sendOtp()" class="btn btn-warning text-dark w-100 fw-bold py-2.5 mb-3">Gửi Mã Khôi Phục OTP</button>

                    <div class="text-center small text-muted"><a th:href="@{/login}" class="fw-bold text-primary text-decoration-none"><i class="fas fa-arrow-left me-1"></i>Quay lại trang Đăng nhập</a></div>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function sendOtp() {
            Swal.fire({
                icon: 'success',
                title: 'Đã gửi mã OTP!',
                text: 'Mã khôi phục mật khẩu đã được gửi đến email của bạn. Vui lòng kiểm tra hòm thư.',
                confirmButtonColor: '#0d6efd'
            });
        }
    </script>
</body>
</html>
