<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản - TechShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
    <link rel="stylesheet" th:href="@{/css/index_style.css}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .auth-card {
            max-width: 500px;
            margin: 0 auto;
            border-radius: 20px;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Header Fragment -->
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="py-5">
        <div class="container">
            <div class="card border-0 shadow-sm p-4 p-md-5 bg-white auth-card">
                <div class="text-center mb-4">
                    <i class="fas fa-user-plus fa-3x text-primary mb-2"></i>
                    <h3 class="fw-bold text-dark mb-1">Tạo Tài Khoản TechShop</h3>
                    <p class="text-muted small">Nhận ưu đãi độc quyền khi mua sắm thiết bị công nghệ</p>
                </div>

                <!-- Alert hiển thị thông báo lỗi từ Service (ví dụ trùng Email) -->
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show small mb-3" role="alert">
                    <i class="fas fa-exclamation-circle me-1"></i> <span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <form th:action="@{/register}" th:object="${registerRequest}" method="post">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Họ và tên *</label>
                        <input type="text" th:field="*{fullName}" class="form-control" 
                               th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'" 
                               placeholder="Nguyễn Văn Tech" required>
                        <div th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="invalid-feedback small"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Email *</label>
                        <input type="email" th:field="*{email}" class="form-control" 
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" 
                               placeholder="techuser@gmail.com" required>
                        <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="invalid-feedback small"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Số điện thoại *</label>
                        <input type="tel" th:field="*{phone}" class="form-control" 
                               th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'" 
                               placeholder="0988777666" required>
                        <div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="invalid-feedback small"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Mật khẩu *</label>
                        <input type="password" th:field="*{password}" class="form-control" 
                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" 
                               placeholder="Tối thiểu 6 ký tự" required>
                        <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="invalid-feedback small"></div>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="terms" checked required>
                        <label class="form-check-label small text-muted" for="terms">Tôi đồng ý với <a href="#" class="text-primary text-decoration-none">Điều khoản dịch vụ TechShop</a></label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2.5 mb-3">Tạo Tài Khoản Mới</button>

                    <div class="text-center small text-muted">Đã có tài khoản? <a th:href="@{/login}" class="fw-bold text-primary text-decoration-none">Đăng nhập ngay</a></div>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
